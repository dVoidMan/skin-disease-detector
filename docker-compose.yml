services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skin_disease_detection_app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      # Persist SQLite database and local uploads between restarts
      - ./database:/app/database
      - ./static:/app/static
      - ./models:/app/models
      - ./templates:/app/templates
      - ./app.py:/app/app.py
      - ./storage.py:/app/storage.py
      - ./config.py:/app/config.py
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-replace-in-production}
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/database/skin_disease.db}
      - CLOUDFLARE_R2_ENABLED=${CLOUDFLARE_R2_ENABLED:-false}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-skin-disease-images}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY:-}
    env_file:
      - path: .env
        required: false

